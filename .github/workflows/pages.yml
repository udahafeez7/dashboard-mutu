name: Deploy Portal Mutu
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan situs (hanya file publik)
        run: |
          set -e
          test -f data/akun.json && test -f data/mutu.enc.json
          if [ -e data/mutu.json ] || [ -d sumber ]; then echo "Data mentah ikut ter-commit. Hapus dari repositori."; exit 1; fi
          mkdir -p _site/data
          cp index.html portal.html dashboard.html _site/
          cp -r assets _site/
          cp data/akun.json data/mutu.enc.json _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
