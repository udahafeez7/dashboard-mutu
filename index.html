<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Masuk · Portal Mutu FTI Universitas Andalas</title>
<link rel="stylesheet" href="assets/portal.css">
</head>
<body class="login-body">
<main class="login-card">
  <h1>Portal Mutu FTI</h1>
  <p class="sub">Universitas Andalas · Gugus Penjamin Mutu</p>
  <form id="f" autocomplete="on" novalidate>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">Masuk</button>
  </form>
  <div id="msg" class="login-msg" hidden></div>
  <p class="login-foot">Akun diberikan oleh admin GPM. Lupa password atau belum punya akun? Hubungi admin GPM FTI.</p>
</main>
<script src="assets/auth.js"></script>
<script src="assets/login.js"></script>
</body>
</html>
